<!DOCTYPE html>
<title>Fullscreen</title>
<body style="margin: 0; background: #00aa00">
<div id="player" style="height: 300px; background: #0000aa"></div>
<script>
var log = [];
function say(what) { log.push(what); document.title = log.join(', '); }
document.addEventListener('fullscreenchange', function () { say('change ' + (document.fullscreenElement ? document.fullscreenElement.id : 'none')); });
document.addEventListener('fullscreenerror', function () { say('error'); });
function ask() {
    document.getElementById('player').requestFullscreen().then(function () { say('granted'); }, function () { say('refused'); });
}
// Asked for with no click behind it: refused.
ask();
document.body.addEventListener('click', ask);
</script>
