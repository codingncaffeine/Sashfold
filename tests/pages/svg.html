<!doctype html>
<html>
<head>
<style>
  body { margin: 8px; font-family: "Sashfold Mono"; font-size: 14px; line-height: 18px; color: #234 }
  p { margin: 0 0 6px }
  .row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px }
  .icon { width: 24px; height: 24px; color: #2a6 }
  .badge { fill: #c33 }
  .frame { border: 1px solid #999; padding: 4px; display: inline-block }
</style>
</head>
<body>
<p>Inline SVG: shapes, strokes, a gradient, a clip, text, and an icon in the page's color.</p>

<div class="row">
  <!-- The icon idiom: a viewBox scaled into a 24px box, filled with currentColor. -->
  <svg class="icon" viewBox="0 0 24 24"><path d="M12 2 L22 22 H2 Z" fill="currentColor"/></svg>
  <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="3"/></svg>
  <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4" class="badge"/></svg>
  <span>three icons at 24px</span>
</div>

<div class="frame">
  <svg width="220" height="90">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#8cf"/>
        <stop offset="1" stop-color="#fff"/>
      </linearGradient>
      <clipPath id="round"><circle cx="45" cy="45" r="30"/></clipPath>
    </defs>
    <rect width="220" height="90" fill="url(#sky)"/>
    <rect x="15" y="15" width="60" height="60" fill="#e94" clip-path="url(#round)"/>
    <polygon points="100,75 130,20 160,75" fill="#4a4" stroke="#242" stroke-width="2" stroke-linejoin="round"/>
    <path d="M170 70 q 20 -60 40 0" fill="none" stroke="#33c" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 4"/>
    <line x1="10" y1="85" x2="210" y2="85" stroke="#000" stroke-width="1"/>
    <text x="110" y="15" font-size="12" text-anchor="middle" fill="#234">a sky</text>
  </svg>
</div>

<p>An SVG as an image, and as a background.</p>
<div class="row">
  <img width="40" height="40" src='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10 10"><rect width="10" height="10" fill="%2333a"/><circle cx="5" cy="5" r="3" fill="%23fd0"/></svg>' alt="a badge">
  <div style='width: 60px; height: 30px; background: url("data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2215%22 height=%2215%22><rect width=%2215%22 height=%2215%22 fill=%22%23ccc%22/><rect width=%227%22 height=%227%22 fill=%22%23888%22/></svg>")'></div>
  <span>a picture and a tiled background</span>
</div>

<p>A responsive SVG with only a viewBox fills its width and keeps its ratio.</p>
<div style="width: 120px; border: 1px dashed #999">
  <svg viewBox="0 0 4 1" style="display: block"><rect width="4" height="1" fill="#48c"/><rect x="1" width="2" height="1" fill="#fff" opacity="0.5"/></svg>
</div>
</body>
</html>
