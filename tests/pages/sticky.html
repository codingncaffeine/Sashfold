<!doctype html>
<html>
<head>
<style>
  body { margin: 8px; font-family: "Sashfold Mono"; font-size: 12px; line-height: 16px }
  p { margin: 0 0 6px }
  .port {
    width: 220px;
    height: 90px;
    overflow: hidden;
    border: 1px solid #999;
    background: #f4f4f4;
    margin: 0 10px 8px 0;
    float: left;
  }
  .stick { position: sticky; height: 24px; background: #c33; color: #fff }
  .filler { height: 200px; background: #e8e8e8 }
  .short { height: 30px; background: #cde }
  .wide { width: 460px; height: 24px; background: #e8e8e8 }
  br { clear: both }
</style>
</head>
<body>
<p>A box that sticks meets the edge its offset names, and stops at the edge of
the block that holds it.</p>

<!-- Its offset holds it 20px below the scrollport's top, and there is room
     in its containing block to go there. -->
<div class="port">
  <div class="stick" style="top: 20px">top 20</div>
  <div class="filler"></div>
</div>

<!-- The same offset, but the block holding it is only 30px tall, so the box
     can move 6px and no further. -->
<div class="port">
  <div class="short"><div class="stick" style="top: 20px">clamped</div></div>
  <div class="filler"></div>
</div>

<!-- An offset already satisfied moves nothing: the box is well below the
     scrollport's top already. -->
<div class="port">
  <div class="short"></div>
  <div class="stick" style="top: 0">at rest</div>
</div>
<br>

<!-- Measured from the bottom edge: the box is far below the scrollport, so
     it comes back up to sit 10px clear of that edge. -->
<div class="port">
  <div class="filler"></div>
  <div class="stick" style="bottom: 10px">bottom 10</div>
</div>

<!-- Across the scrollport rather than down it. -->
<div class="port">
  <div class="wide"><div class="stick" style="left: 30px; width: 90px">left 30</div></div>
  <div class="filler"></div>
</div>

<!-- Both axes at once, and both clamped by the same block. -->
<div class="port">
  <div class="short"><div class="stick" style="top: 40px; left: 12px; width: 90px">both</div></div>
  <div class="filler"></div>
</div>
<br>
</body>
</html>
