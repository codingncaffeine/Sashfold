name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux-gcc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
      - run: bash tools/pledge-check.sh build/sashfold
      - run: bash tools/egress-check.sh

  # The Web Platform Tests' CSS reference tests: the checkout is fetched at
  # the pinned revision, and every test the baseline names must still pass.
  wpt-css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: bash tools/wpt-fetch.sh
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --target wpt_reftest
      - run: ./build/tests/wpt_reftest wpt tests/wpt/directories.txt tests/wpt/passing.txt --revision tests/wpt/REVISION

  # test262, the ECMAScript conformance suite: the checkout is fetched at
  # the pinned revision, and every test the baseline names must still pass.
  test262:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: bash tools/test262-fetch.sh
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --target test262_runner
      - run: ./build/tests/test262_runner test262 tests/test262/directories.txt tests/test262/passing.txt --revision tests/test262/REVISION

  # The Unicode bidirectional algorithm against its own conformance files.
  # They are 15 MB, so they are fetched at the version pinned in
  # tests/ucd/VERSION rather than committed; the other jobs run the test's
  # hand-written cases without them.
  bidi-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: bash tools/ucd-fetch.sh
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --target test_bidi
      - run: ./build/tests/test_bidi ucd/BidiCharacterTest.txt ucd/BidiTest.txt

  linux-clang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build clang
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure

  linux-sanitizers:
    runs-on: ubuntu-latest
    env:
      # A report that names its caller: the vptr check alone prints the
      # object, not the frame that reached it.
      UBSAN_OPTIONS: print_stacktrace=1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build clang
      - run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure

  linux-fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build clang
      - run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_COMPILER=clang++ -DSASHFOLD_FUZZ=ON
      - run: cmake --build build
      - run: ./build/fuzz_html_tokenizer -max_total_time=40 -timeout=5 fuzz/corpus/html_tokenizer
      - run: ./build/fuzz_html_tree -max_total_time=40 -timeout=5 fuzz/corpus/html_tokenizer
      - run: ./build/fuzz_truetype -max_total_time=30 -timeout=5 fuzz/corpus/truetype
      - run: ./build/fuzz_png -max_total_time=30 -timeout=5 fuzz/corpus/png
      - run: ./build/fuzz_x509 -max_total_time=30 -timeout=5 fuzz/corpus/x509
      - run: ./build/fuzz_gif -max_total_time=30 -timeout=5 fuzz/corpus/gif
      - run: ./build/fuzz_jpeg -max_total_time=30 -timeout=5 fuzz/corpus/jpeg
      - run: ./build/fuzz_bmp -max_total_time=30 -timeout=5 fuzz/corpus/bmp
      - run: ./build/fuzz_zip -max_total_time=30 -timeout=5 fuzz/corpus/zip
      - run: ./build/fuzz_webm -max_total_time=30 -timeout=5 fuzz/corpus/webm

  windows-mingw:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
      - run: bash tools/pledge-check.sh build/sashfold.exe
      - run: bash tools/egress-check.sh
      # The Windows download, staged as the release ships it: the binary, the
      # themes, the blocklists folder's note, the license and the README.
      - run: |
          version=$(sed -n 's/^project(sashfold LANGUAGES CXX VERSION \([0-9.]*\))/\1/p' CMakeLists.txt)
          stage="sashfold-$version-windows-x64"
          mkdir -p "$stage/themes" "$stage/blocklists"
          cp build/sashfold.exe LICENSE README.md "$stage/"
          cp themes/*.json "$stage/themes/"
          cp blocklists/README.md "$stage/blocklists/"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-x64
          path: sashfold-*-windows-x64

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: brew install ninja
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
      - run: bash tools/pledge-check.sh build/sashfold
      - run: bash tools/egress-check.sh

  # The Linux download: a Release build with the C++ runtime linked in, so it
  # runs on a distribution with an older libstdc++ (the floor is this
  # runner's glibc), held to the pledge, staged as the release ships it.
  linux-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build imagemagick
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSASHFOLD_PORTABLE=ON
      - run: cmake --build build --target sashfold
      - run: bash tools/pledge-check.sh build/sashfold
      - run: |
          version=$(sed -n 's/^project(sashfold LANGUAGES CXX VERSION \([0-9.]*\))/\1/p' CMakeLists.txt)
          stage="sashfold-$version-linux-x64"
          mkdir -p "$stage/themes" "$stage/blocklists" "$stage/tools" "$stage/assets"
          cp build/sashfold LICENSE README.md "$stage/"
          cp themes/*.json "$stage/themes/"
          cp blocklists/README.md "$stage/blocklists/"
          cp tools/install-desktop-linux.sh "$stage/tools/"
          cp assets/icon.png "$stage/assets/"
          mkdir -p "$stage/packaging/linux"
          cp packaging/linux/sashfold.desktop "$stage/packaging/linux/"
          # The icon at every size the desktop names, squared; the launcher
          # installer and the packages take these as they are.
          extent=$(convert assets/icon.png -format "%[fx:max(w,h)]x%[fx:max(w,h)]" info:)
          for size in 16 22 24 32 48 64 128 256 512; do
            mkdir -p "$stage/assets/icons/hicolor/${size}x${size}/apps"
            convert assets/icon.png -background none -gravity center -extent "$extent" -resize "${size}x${size}" "$stage/assets/icons/hicolor/${size}x${size}/apps/sashfold.png"
          done
          ldd "$stage/sashfold"
          bash packaging/deb/build-deb.sh "$stage" .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-x64
          path: sashfold-*-linux-x64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-deb
          path: sashfold_*_amd64.deb
